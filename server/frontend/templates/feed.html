<form action="/feed" method="POST" enctype="multipart/form-data">
  <h3>Existing Feeders</h3>
  {{range $i, $f := .feeders}}
    <div>
      <label><input type="checkbox" name="enabled_existing_{{$i}}" {{if $f.Enabled}}checked{{end}}> Enable</label>
      <strong>Team:</strong> {{$f.Team}}, 
      <strong>Periodicity:</strong> {{$f.Periodicity}}, 
      <strong>PseudoChecker:</strong> {{base $f.PseudoChecker}}
    </div>
  {{else}}
    <p>No feeders uploaded yet.</p>
  {{end}}

  <hr>
  <h3>Add New Feeders</h3>
  <div id="triplets-container">
    <div class="triplet-entry">
      <input type="text" name="teamname[]" placeholder="Team Name" required>
      <input type="number" name="periodicity[]" placeholder="Periodicity" required>
      <input type="file" name="pseudochecker[]" required>
      <button type="button" onclick="removeTriplet(this)">Remove</button>
    </div>
  </div>

  <button type="button" onclick="addTriplet()">Add Triplet</button><br><br>
  <input type="submit" value="Submit">
</form>

<script>
function addTriplet() {
  const container = document.getElementById("triplets-container");
  const div = document.createElement("div");
  div.className = "triplet-entry";
  div.innerHTML = `
    <input type="text" name="teamname[]" placeholder="Team Name" required>
    <input type="number" name="periodicity[]" placeholder="Periodicity" required>
    <input type="file" name="pseudochecker[]" required>
    <button type="button" onclick="removeTriplet(this)">Remove</button>
  `;
  container.appendChild(div);
}

function removeTriplet(btn) {
  btn.parentElement.remove();
}
</script>
