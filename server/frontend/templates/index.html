<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/static/favicon.ico">
    <title>Chupapi Munyanya Farm</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        textarea { width: 100%; height: 100px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f0f0f0; }
        .pagination { margin-top: 20px; }
        .pagination button { margin-right: 5px; }
    </style>
    <script>
        window.API_KEY = "{{ .Cfg.ApiToken }}";
        window.FLAG_FORMAT = "{{ .Cfg.FlagFormat }}";
    </script>
    <script src="/static/js/manualSubmit.js" defer></script>
</head>
<body>
    <h1>
    Chupapi Munyanya Farm
    <img src="/static/img/bebra.jpeg" alt="Bebra" style="width: 80px; height: 80px; vertical-align: middle; margin-left: 16px;">
    </h1>
    <h2>Submit Flags</h2>
    <textarea id="flag-input" placeholder="Text with flags of format {{ .Cfg.FlagFormat }}"></textarea>
    <button onclick="submitFlags()">Submit</button>

    <h2>Filter Flags</h2>
    <label>Sploit: <input type="text" id="filter-sploit"></label>
    <label>Team: <input type="text" id="filter-team"></label>
    <label>Status: <input type="text" id="filter-status"></label>
    <label>Response: <input type="text" id="filter-response"></label>
    <button onclick="loadFlags()">Apply Filters</button>

    <h2>Flags</h2>
    <table id="flag-table">
        <thead>
            <tr>
                <th>Time</th>
                <th>Flag</th>
                <th>Sploit</th>
                <th>Team</th>
                <th>Status</th>
                <th>Response</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div class="pagination" id="pagination"></div>
</body>
</html>
